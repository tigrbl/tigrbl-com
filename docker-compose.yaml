services:
  tigrbl-com:
    build: .
    container_name: tigrbl-com
    restart: unless-stopped
    labels:
      site.host: tigrbl.com
      site.kind: mdwrk-lander
    expose:
      - "80"
    networks:
      dockerwp:
        aliases:
          - tigrbl-com

networks:
  dockerwp:
    name: dockerwp
    external: true
