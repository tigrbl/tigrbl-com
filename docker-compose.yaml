services:
  tigrbl-com:
    build: .
    container_name: tigrbl-com
    restart: unless-stopped
    labels:
      site.host: tigrbl.com
      site.kind: mdwrk-lander
    expose:
      - "80"
    networks:
      portwyrm-edge:
        aliases:
          - tigrbl-com

networks:
  portwyrm-edge:
    name: portwyrm-edge
    external: true
