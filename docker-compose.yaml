services:
  tigrbl-com:
    build:
      context: .
      args:
        SOURCE_COMMIT: ${GITHUB_SHA:-local}
    container_name: tigrbl-com
    restart: unless-stopped
    labels:
      site.host: tigrbl.com
      site.kind: mdwrk-lander
    expose:
      - "80"
    networks:
      private:
      edge:
        aliases:
          - tigrbl-com

networks:
  private:
    name: tigrbl-com-private
    internal: true
    ipam:
      config:
        - subnet: 10.104.117.0/28
  edge:
    name: portwyrm-edge
    external: true
