log_format website '$request_method $uri $status $body_bytes_sent';
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /dev/stdout website;
  error_log /dev/stderr warn;
  server_tokens off;
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json application/xml text/xml application/rss+xml application/atom+xml image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Cache-Control "public, max-age=0, must-revalidate" always;
  if ($host = www.tigrbl.com) { return 308 https://tigrbl.com$request_uri; }
  error_page 404 /404.html;
  location = /404.html { internal; }
  location = /full-llms.txt { return 308 /llms-full.txt; }
  # Preserve public links to the previous child sitemap names.
  location = /sitemap-home.xml { return 308 /sitemaps/pages.xml; }
  location = /sitemap-how-it-works.xml { return 308 /sitemaps/pages.xml; }
  location = /sitemap-ecosystem.xml { return 308 /sitemaps/pages.xml; }
  location = /sitemap-get-started.xml { return 308 /sitemaps/pages.xml; }
  location = /sitemap-examples.xml { return 308 /sitemaps/examples.xml; }
  location = /sitemap-releases.xml { return 308 /sitemaps/releases.xml; }
  location = /rss.xml { types { application/rss+xml xml; } try_files $uri =404; }
  location = /atom.xml { types { application/atom+xml xml; } try_files $uri =404; }
  location = / { try_files /index.html =404; }
  location ~ ^/(.+)/$ { return 308 /$1$is_args$args; }
  location / { try_files $uri/index.html $uri =404; }
  location ~* \.(?:css|js|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }
}
