apiVersion: wyrmctl.com/v1
kind: DesiredState
schemaVersion: 3
metadata:
  name: tigrbl-com-production
  owner: tigrbl-com
  environment: production
spec:
  proxyHosts:
    - domain_names:
        - tigrbl.com
        - www.tigrbl.com
      forward_scheme: http
      forward_host: tigrbl-com
      forward_port: 80
      certificate_ref: cert.tigrbl-com
      ssl_forced: 1
      http2_support: 1
      hsts_enabled: 1
      hsts_subdomains: 0
      allow_websocket_upgrade: 1
      block_exploits: 1
      meta:
        managed_by: wyrmctl
        owner: tigrbl-com
        resource_id: proxy.tigrbl-com
  certificates:
    - name: tigrbl.com
      domain_names:
        - tigrbl.com
        - www.tigrbl.com
      certificate_type: letsencrypt
      api_payload:
        provider: letsencrypt
        meta:
          letsencrypt_email: jacob@swarmauri.com
          letsencrypt_agree: true
          dns_challenge: false
      meta:
        managed_by: wyrmctl
        owner: tigrbl-com
        resource_id: cert.tigrbl-com
  quicPassthroughHosts: []
  accessLists: []
  redirectionHosts: []
  deadHosts: []
  streams: []
  users: []
  settings: []
  dnsRecords: []
  pluginResources: []
  externalCertificates: []
