apiVersion: wyrmctl.com/v1
kind: DesiredState
schemaVersion: 3
metadata:
  name: tigrbl-com-http-bootstrap
  owner: tigrbl-com
  environment: production
spec:
  proxyHosts:
    - domain_names:
        - tigrbl.com
        - www.tigrbl.com
      forward_scheme: http
      forward_host: tigrbl-com
      forward_port: 80
      ssl_forced: 0
      http2_support: 0
      hsts_enabled: 0
      hsts_subdomains: 0
      allow_websocket_upgrade: 1
      block_exploits: 1
      meta:
        managed_by: wyrmctl
        owner: tigrbl-com
        resource_id: proxy.tigrbl-com
  certificates: []
  quicPassthroughHosts: []
  accessLists: []
  redirectionHosts: []
  deadHosts: []
  streams: []
  users: []
  settings: []
  dnsRecords: []
  pluginResources: []
  externalCertificates: []
