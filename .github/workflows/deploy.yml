name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - ".github/workflows/dns-cutover.yml"
      - "scripts/namecheap-dns-cutover.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-tigrbl-com
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: npm ci
      - run: uv sync --frozen --dev
      - run: npm run check
      - run: npm run build
      - run: npm run routing:validate
      - run: npm run proxy:target-check

  deploy:
    needs: bootstrap-http-route
    uses: cobycloud/actions/.github/workflows/reusable-vm104-wyrmctl-compose-deploy.yml@9e53be1283fcd9c26bbc5ab1cc4c59b5dec27885
    with:
      compose-file: docker-compose.yaml
      compose-project: tigrbl-com
      desired-state: .wyrmctl/desired-state/production/desired-state.yaml
      owner: tigrbl-com
      public-host: tigrbl.com
      public-service: tigrbl-com
      containers-json: '["tigrbl-com"]'
      verify-path: /

  bootstrap-http-route:
    needs: validate
    runs-on:
      group: portwyrm-deployment
      labels: [self-hosted, Linux, X64, vm104]
    environment: deployment
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - uses: cobycloud/actions/actions/wyrmctl-setup@56c4a13434c7ec49453bf109d7d6955158992b5a
      - name: Plan and apply the HTTP challenge route
        env:
          WYRMCTL_CREDENTIAL: /etc/groupsum/portwyrm.env
        shell: bash
        run: |
          set -euo pipefail
          test -r "$WYRMCTL_CREDENTIAL"
          base_url="$(sed -n 's/^PORTWYRM_WYRMCTL_BASE_URL=//p' "$WYRMCTL_CREDENTIAL")"
          identity="$(sed -n 's/^PORTWYRM_WYRMCTL_IDENTITY=//p' "$WYRMCTL_CREDENTIAL")"
          secret="$(sed -n 's/^PORTWYRM_WYRMCTL_SECRET_B64=//p' "$WYRMCTL_CREDENTIAL" | base64 -d)"
          echo "::add-mask::$secret"
          evidence="$RUNNER_TEMP/tigrbl-com-bootstrap"
          mkdir -p "$evidence"
          export NPM_BASE_URL="$base_url" NPM_IDENTITY="$identity" NPM_SECRET="$secret"
          wyrmctl --output json plan .wyrmctl/migrations/0001-bootstrap-http-route.yaml \
            --owner tigrbl-com \
            --artifact-out "$evidence/plan.json" \
            --repository "$GITHUB_REPOSITORY" \
            --environment production \
            --commit "$GITHUB_SHA" \
            --validate-output
          wyrmctl --output json apply \
            --artifact "$evidence/plan.json" \
            --repository "$GITHUB_REPOSITORY" \
            --environment production \
            --commit "$GITHUB_SHA" \
            --report "$evidence/apply.json" \
            --audit-log "$evidence/audit.json" \
            --rollback-plan "$evidence/rollback.json" \
            --validate-output
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tigrbl-com-bootstrap-${{ github.sha }}
          path: ${{ runner.temp }}/tigrbl-com-bootstrap/
          if-no-files-found: warn
          retention-days: 14

  verify-content:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify public content identity
        shell: bash
        run: |
          set -euo pipefail
          expected_asset="$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -n 1)"
          test -n "$expected_asset"
          for host in tigrbl.com www.tigrbl.com; do
            public_html="$(curl --silent --show-error --location --max-time 30 "https://$host/")"
            grep -Fq "$expected_asset" <<< "$public_html"
            echo "$host serves $expected_asset"
          done
