name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-tigrbl-com
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: npm ci
      - run: uv sync --frozen --dev
      - run: npm run check
      - run: npm run build
      - run: npm run routing:validate
      - run: npm run proxy:target-check

  deploy:
    needs: validate
    uses: cobycloud/actions/.github/workflows/reusable-vm104-wyrmctl-compose-deploy.yml@9e53be1283fcd9c26bbc5ab1cc4c59b5dec27885
    with:
      compose-file: docker-compose.yaml
      compose-project: tigrbl-com
      desired-state: .wyrmctl/desired-state/production/desired-state.yaml
      owner: tigrbl-com
      public-host: tigrbl.com
      public-service: tigrbl-com
      containers-json: '["tigrbl-com"]'
      verify-path: /

  verify-content:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify public content identity
        shell: bash
        run: |
          set -euo pipefail
          expected_asset="$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -n 1)"
          test -n "$expected_asset"
          for host in tigrbl.com www.tigrbl.com; do
            public_html="$(curl --silent --show-error --location --max-time 30 "https://$host/")"
            grep -Fq "$expected_asset" <<< "$public_html"
            echo "$host serves $expected_asset"
          done
