name: sealed secret bridge

on:
  workflow_dispatch:
    inputs:
      target_public_key:
        description: Target repository Actions public key
        required: true
        type: string
      target_key_id:
        description: Target repository Actions public key ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-latest
    environment: deployment
    env:
      SOURCE_NPM_IDENTITY: ${{ secrets.NPM_IDENTITY }}
      SOURCE_NPM_SECRET: ${{ secrets.NPM_SECRET }}
      SOURCE_NAMECHEAP_API_USER: ${{ secrets.NAMECHEAP_API_USER }}
      SOURCE_NAMECHEAP_API_KEY: ${{ secrets.NAMECHEAP_API_KEY }}
      SOURCE_NAMECHEAP_USERNAME: ${{ secrets.NAMECHEAP_USERNAME }}
      SOURCE_NAMECHEAP_CLIENT_IP: ${{ secrets.NAMECHEAP_CLIENT_IP }}
      TARGET_PUBLIC_KEY: ${{ inputs.target_public_key }}
      TARGET_KEY_ID: ${{ inputs.target_key_id }}
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install sealed-box runtime
        run: python -m pip install --disable-pip-version-check pynacl==1.6.2
      - name: Seal repository secrets to target key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sealed-secret-bridge"
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          from nacl.public import PublicKey, SealedBox

          names = (
              "NPM_IDENTITY",
              "NPM_SECRET",
              "NAMECHEAP_API_USER",
              "NAMECHEAP_API_KEY",
              "NAMECHEAP_USERNAME",
              "NAMECHEAP_CLIENT_IP",
          )
          public_key = PublicKey(base64.b64decode(os.environ["TARGET_PUBLIC_KEY"]))
          sealed_box = SealedBox(public_key)
          encrypted: dict[str, str] = {}
          for name in names:
              value = os.environ.get(f"SOURCE_{name}", "")
              if not value:
                  raise SystemExit(f"Required source secret is not configured: {name}")
              encrypted[name] = base64.b64encode(sealed_box.encrypt(value.encode())).decode()
          payload = {
              "key_id": os.environ["TARGET_KEY_ID"],
              "encrypted_values": encrypted,
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "sealed-secret-bridge" / "secrets.json"
          output.write_text(json.dumps(payload, sort_keys=True), encoding="utf-8")
          print(f"Sealed {len(encrypted)} secrets to the target repository key")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sealed-secret-bridge-${{ github.run_id }}
          path: ${{ runner.temp }}/sealed-secret-bridge/secrets.json
          if-no-files-found: error
          retention-days: 1
