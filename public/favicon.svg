<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="22" fill="#0D0D11" stroke="#27272A" stroke-width="2"/>
  <!-- Glowing orange mesh effect background -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="45" fill="url(#glow)"/>

  <!-- Sleek Tiger Slash / Schema intersection representing multi-protocol compilation -->
  <g transform="translate(10, 10)">
    <!-- Primary orange slash -->
    <path d="M 15,65 C 22,42 35,28 65,15 C 48,32 40,48 15,65 Z" fill="#F97316"/>
    <!-- Secondary light orange offset slash -->
    <path d="M 32,70 C 38,52 48,38 72,28 C 58,42 52,54 32,70 Z" fill="#FB923C"/>
    <!-- Outer node dots representing compiled paths/endpoints -->
    <circle cx="15" cy="65" r="4" fill="#F97316"/>
    <circle cx="65" cy="15" r="4" fill="#F97316"/>
    <circle cx="72" cy="28" r="3" fill="#FB923C"/>
  </g>
</svg>
